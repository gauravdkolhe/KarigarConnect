<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KarigarConnect — AI-Powered Artisan Marketplace & Sourcing</title>
    <meta name="description" content="Digitizing traditional artisans with AI catalog generation, dynamic pricing recommendations, and genuine buyer market linkage." />
    <!-- Google Fonts: Outfit (headings) & Inter (body) — loaded async so fonts never block page render -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking async font load -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" /></noscript>
  </head>
  <body>
    <!-- Instant loading indicator before React mounts -->
    <div id="root">
      <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#FDFBF7;font-family:system-ui,sans-serif;gap:1rem;">
        <div style="width:48px;height:48px;border:4px solid #F7F4EE;border-top-color:#C85A32;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
        <p style="color:#64748B;font-size:0.95rem;margin:0;">Loading KarigarConnect…</p>
        <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
